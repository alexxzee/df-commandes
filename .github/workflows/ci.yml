name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Tests
        run: npm test

      - name: Couverture de src/devis
        run: node --test --experimental-test-coverage --test-coverage-include='src/devis/**' --test-coverage-lines=80 --test-coverage-branches=80
